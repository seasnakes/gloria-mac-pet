# A branch run builds both packages. A version tag also publishes them together.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the DMG
        run: bash build.sh --dmg
      - name: Verify the packaged Mac application
        run: |
          version=$(cat VERSION)
          dmg="dist/GLORIA-$version.dmg"
          hdiutil verify "$dmg"
          mount_dir=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          trap 'hdiutil detach "$mount_dir"' EXIT
          app="$mount_dir/GLORIA.app/Contents"
          codesign --verify --deep --strict "$mount_dir/GLORIA.app"
          lipo -verify_arch arm64 x86_64 "$app/MacOS/GLORIA"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "$version"
          for pet in fourteen grokbot; do test -s "$app/Resources/$pet.usdz"; done
      - uses: actions/upload-artifact@v4
        with:
          name: GLORIA-dmg
          path: dist/*.dmg
  windows:
    uses: ./.github/workflows/windows.yml
  publish:
    needs: [dmg, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GLORIA-dmg
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: GLORIA-Windows
          path: dist
      - name: Publish both packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" "dist/GLORIA-$version.dmg" "dist/GLORIA-$version-Windows.zip" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "GLORIA $version" --notes-from-tag
