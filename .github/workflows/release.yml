name: release
on: workflow_dispatch
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-gloria-v0.9.0
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: seasnakes/gloria-mac-pet
      CANDIDATE: 0edb7bcc04097e2d09c7afd4846e9d83a2e5f194
      SOURCE_RUN: '44354806972'
      TAG: v0.9.0
      NOTES_BASE64: 
    steps:
      - name: Verify candidate and download the two packages
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$GH_REPO"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE"
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
          workflow=$(gh api "repos/$GH_REPO/actions/workflows/release.yml" --jq .id)
          jq -e --arg repo "$GH_REPO" --arg sha "$CANDIDATE" --argjson workflow "$workflow" --argjson run "$SOURCE_RUN" '
            .id==$run and .workflow_id==$workflow and .head_sha==$sha and .repository.full_name==$repo and
            .head_repository.full_name==$repo and .status=="completed" and .conclusion=="success"
          ' run.json >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" > jobs.json
          jq -e '([.jobs[]|select(.conclusion=="success")|.name] | contains(["dmg","windows / windows"]))' jobs.json >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > artifacts.json
          mkdir dist
          fetch_package() {
            local name=$1 file=$2 id digest actual
            id=$(jq -er --arg name "$name" '[.artifacts[]|select(.name==$name and .expired==false)] | select(length==1) | .[0].id' artifacts.json)
            digest=$(jq -er --argjson id "$id" '.artifacts[]|select(.id==$id)|.digest|select(test("^sha256:[0-9a-f]{64}$"))' artifacts.json)
            gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > "$name.zip"
            actual="sha256:$(sha256sum "$name.zip" | cut -d' ' -f1)"
            test "$actual" = "$digest"
            test "$(unzip -Z -1 "$name.zip")" = "$file"
            unzip -tqq "$name.zip"
            unzip -p "$name.zip" "$file" > "dist/$file"
            test -s "dist/$file"
          }
          fetch_package GLORIA-dmg GLORIA-0.9.0.dmg
          fetch_package GLORIA-Windows GLORIA-0.9.0-Windows.zip
          unzip -tqq dist/GLORIA-0.9.0-Windows.zip
          test "$(tail -c 512 dist/GLORIA-0.9.0.dmg | head -c4)" = koly
          sha256sum dist/*
          printf '%s' "$NOTES_BASE64" | base64 -d > notes.md
      - name: Publish the verified packages under the annotated tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE"
          ref="refs/tags/$TAG"
          gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" > refs.json
          existing=$(jq -r --arg ref "$ref" '.[]|select(.ref==$ref)|.object.sha' refs.json)
          if [[ -z "$existing" ]]; then
            jq -n --arg tag "$TAG" --arg sha "$CANDIDATE" --rawfile notes notes.md '{tag:$tag,message:$notes,object:$sha,type:"commit"}' > tag.json
            existing=$(gh api --method POST "repos/$GH_REPO/git/tags" --input tag.json --jq .sha)
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=$ref" -f "sha=$existing" >/dev/null
          fi
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.type)" = tag
          gh api "repos/$GH_REPO/git/tags/$existing" | jq -e --arg sha "$CANDIDATE" '.object.type=="commit" and .object.sha==$sha' >/dev/null
          gh api "repos/$GH_REPO/releases?per_page=100" > releases.json
          release_id=$(jq -r --arg tag "$TAG" '.[]|select(.tag_name==$tag)|.id' releases.json)
          if [[ -z "$release_id" ]]; then
            gh release create "$TAG" --repo "$GH_REPO" --draft --verify-tag --title 'GLORIA 0.9.0' --notes-file notes.md
            release_id=$(gh api "repos/$GH_REPO/releases?per_page=100" | jq -er --arg tag "$TAG" '.[]|select(.tag_name==$tag)|.id')
          fi
          endpoint="repos/$GH_REPO/releases/$release_id"
          draft=$(gh api "$endpoint" --jq .draft)
          for file in dist/*; do
            name=$(basename "$file")
            expected="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            gh api "$endpoint/assets" > assets.json
            if ! jq -e --arg name "$name" 'any(.[];.name==$name)' assets.json >/dev/null; then
              test "$draft" = true
              gh release upload "$TAG" "$file" --repo "$GH_REPO"
            fi
            gh api "$endpoint/assets" | jq -e --arg name "$name" --arg expected "$expected" 'any(.[];.name==$name and .state=="uploaded" and .digest==$expected)' >/dev/null
          done
          if [[ "$draft" = true ]]; then
            # Address the draft by ID so there is no dependency on finding it via a tag lookup.
            gh api --method PATCH "$endpoint" -F draft=false -f make_latest=true --jq .html_url
          fi
          gh api "$endpoint" | jq -e '.draft==false and .prerelease==false and (.assets|length)==2' >/dev/null
