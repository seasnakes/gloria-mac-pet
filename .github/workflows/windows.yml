name: Windows desktop pet
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['Windows/**', 'characters/**', 'VERSION', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the portable ZIP
        shell: powershell
        run: ./Windows/build.ps1
      - name: Test the packaged hook installer
        shell: powershell
        run: ./Windows/smoke.ps1 -Zip (Get-Item dist/*-Windows.zip).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: GLORIA-Windows
          path: dist/*-Windows.zip
