<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>测试帧动态预览</title>
<style>
:root{--bg:#f4f1f8;--card:#ffffff;--ink:#3e3046;--muted:#8a7e93;--line:#e4dcec;--wall1:#cfe3ff;--wall2:#f7d6ea;--win:#fbfaff;--bar:#e9e3f3;--dock:rgba(255,255,255,.55);--tag:#f39cc9}
:root[data-theme="dark"]{--bg:#17151c;--card:#211e28;--ink:#eee7f4;--muted:#a597b0;--line:#352f40;--wall1:#2b3550;--wall2:#4a2e45;--win:#2c2935;--bar:#3a3545;--dock:rgba(255,255,255,.14)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC",sans-serif}
header{padding:20px 20px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}.note{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.ctl button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;cursor:pointer}
.ctl button.on{background:var(--tag);border-color:var(--tag);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:12px 20px 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage{position:relative;height:300px;background:linear-gradient(160deg,var(--wall1),var(--wall2));overflow:hidden}
.big .stage{height:470px}
.win{position:absolute;left:8%;right:8%;bottom:0;background:var(--win);border-radius:9px 9px 0 0;box-shadow:0 6px 18px rgba(60,40,80,.18)}
.win::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:var(--bar);border-radius:9px 9px 0 0}
.win i{position:absolute;top:7px;width:9px;height:9px;border-radius:50%}
.dock{position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--dock);backdrop-filter:blur(6px)}
.sprite{position:absolute;image-rendering:auto;pointer-events:none}
.cap{padding:10px 12px}.cap b{display:block}.cap span{color:var(--muted);font-size:12.5px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--tag);color:#fff;margin-left:6px;vertical-align:1px}
.chip.ok{background:#8fb4f5}
.z{position:absolute;font-weight:800;color:#9fb4f5;opacity:0;animation:z 3s linear infinite}
@keyframes z{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(18px,-46px) scale(1.15);opacity:0}}
svg.cursor{position:absolute;width:18px;height:24px}
@media (max-width:560px){header{padding:16px}.grid{padding:10px 16px 24px}}
</style></head><body>
<header><div><h1>坐 · 跳舞 · 睡觉 · 被拎起 — 测试帧动态预览</h1>
<p class="note">每个动作现在只有 1 张测试帧。动起来的部分是程序加的（呼吸、按 116 BPM 摇摆、钟摆晃动），用来看放进 App 的感觉；真正的逐帧动画要等你确认画风后才生成。第一格是已验收的待机动画，作对照。</p></div>
<div class="ctl"><button id="sz" class="on">App 实际大小</button> <button id="th">深色桌面</button></div></header>

    w.innerHTML='<i style="left:10px;background:#ff6b6b"></i><i style="left:24px;background:#ffc94d"></i><i style="left:38px;background:#58d16b"></i>';st.appendChild(w);}
  if(s.ground==="dock"){const d=document.createElement('div');d.className='dock';st.appendChild(d);}
  const img=document.createElement('img');img.className='sprite';img.src=s.k==="idle"?IDLE[0]:C[s.k];
  img.style.width=192*scale+'px';img.style.height=208*scale+'px';st.appendChild(img);
  const W=st.clientWidth||260; const cx=()=>st.clientWidth/2;
  let ax=96,ay=201,gy=H-16; if(s.k==="perch"){ay=149;gy=winTop} if(s.k==="sleep"){gy=winTop} if(s.k==="dangle"){ay=72;gy=scale>1?150:95}
  img.style.transformOrigin=(ax*scale)+'px '+(ay*scale)+'px';
  const place=()=>{img.style.left=(cx()-ax*scale)+'px';img.style.top=(gy-ay*scale)+'px'};place();
  if(s.k==="dangle"){const c=document.createElementNS('http://www.w3.org/2000/svg','svg');c.setAttribute('viewBox','0 0 18 24');c.classList.add('cursor');
    c.innerHTML='<path d="M1 1 L1 19 L6 14 L9.5 22 L12.5 20.6 L9 13 L16 13 Z" fill="#fff" stroke="#222" stroke-width="1.3" stroke-linejoin="round"/>';
    st.appendChild(c);const pc=()=>{c.style.left=(cx()-2)+'px';c.style.top=(gy-3)+'px'};pc();els.push({s,img,place:()=>{place();pc()}});}
  else els.push({s,img,place});
  if(s.k==="sleep"){for(let i=0;i<3;i++){const z=document.createElement('div');z.className='z';z.textContent='z';
    z.style.fontSize=(13+i*3)*scale/0.62+'px';z.style.left=(cx()+34*scale)+'px';z.style.top=(gy-150*scale)+'px';z.style.animationDelay=(i*1)+'s';st.appendChild(z);}}
  const cap=document.createElement('div');cap.className='cap';cap.innerHTML='<b>'+s.t+(s.chip?'<span class="chip ok">'+s.chip+'</span>':'<span class="chip">单帧 + 程序动作</span>')+'</b><span>'+s.d+'</span>';card.appendChild(cap);}
}
let idleStart=performance.now()/1000, hold=2.4;
function tick(ms){const t=ms/1000;
 for(const e of els){const k=e.s.k, im=e.img;
  if(k==="idle"){const u=t-idleStart;let f=0;if(u>hold){f=Math.floor((u-hold)/0.12)+1;if(f>5){idleStart=t;hold=1.8+Math.random()*2.4;f=0}}
    const src=IDLE[f]; if(im.dataset.f!=f){im.src=src;im.dataset.f=f}}
  else if(k==="perch"){const b=Math.sin(t*2*Math.PI/3.2);im.style.transform=`rotate(${b*0.6}deg) scale(1,${1+0.012*b})`}
  else if(k==="sleep"){const b=Math.sin(t*2*Math.PI/4.2);im.style.transform=`scale(${1+0.006*b},${1+0.018*b})`}
  else if(k==="dance"){const beat=t*116/60, i=Math.floor(beat), ph=beat-i;
    const swing=Math.cos(Math.PI*((i%2)+ph)), bounce=Math.abs(Math.sin(Math.PI*ph)), hit=Math.max(0,1-ph*5);
    im.style.transform=`translate(${-swing*3*scale/0.62}px,${-bounce*6*scale/0.62}px) rotate(${-swing*8}deg) scale(${1+0.045*hit},${1-0.07*hit})`}
  else if(k==="dangle"){const a=14*Math.sin(t*2*Math.PI/1.7)*(0.7+0.3*Math.sin(t*0.9));im.style.transform=`rotate(${a}deg)`}
 }
 requestAnimationFrame(tick)}
document.getElementById('sz').onclick=e=>{scale=scale>1?0.62:1.24;e.target.textContent=scale>1?'放大 2 倍':'App 实际大小';build()};
document.getElementById('th').onclick=e=>{const r=document.documentElement;const d=r.dataset.theme!=="dark";r.dataset.theme=d?"dark":"light";e.target.classList.toggle('on',d)};
window.addEventListener('resize',()=>els.forEach(e=>e.place()));
build();requestAnimationFrame(tick);
</script></body></html>
